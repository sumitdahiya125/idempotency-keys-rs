[package]
name = "idempotency-keys"
version = "0.1.0"
edition = "2021"
authors = ["Sumit Kumar <sumitdahiya1647@gmail.com>"]
description = "HTTP idempotency-key middleware for Axum — caches responses by Idempotency-Key header so retries don't double-process."
license = "MIT"
repository = "https://github.com/sumitdahiya125/idempotency-keys-rs"
readme = "README.md"
keywords = ["idempotency", "axum", "middleware", "payments", "http"]
categories = ["web-programming", "asynchronous"]

[dependencies]
async-trait = "0.1"
axum = "0.7"
bytes = "1"
http = "1"
http-body-util = "0.1"
hex = "0.4"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"

[dev-dependencies]
axum = { version = "0.7", features = ["macros"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "server"
path = "examples/server.rs"
